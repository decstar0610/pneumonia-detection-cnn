# Render Blueprint — PneumoScan API (free Docker web service).
# In the Render dashboard: New > Blueprint, connect this GitHub repo; Render reads
# this file. The model is pulled from HF Hub at build time (see api/Dockerfile).
services:
  - type: web
    name: pneumoscan-api
    runtime: docker
    dockerfilePath: ./api/Dockerfile
    dockerContext: .
    plan: free
    region: oregon
    healthCheckPath: /health
    envVars:
      # Production frontend origin. Exact match — no wildcard.
      - key: CORS_ALLOW_ORIGINS
        value: "https://pneumonia-detection-cnn-chi.vercel.app"
      # Vercel gives every branch/commit preview its own generated subdomain, so
      # the exact-match list above would block them. This admits previews of this
      # project only, rather than reopening the policy to "*".
      - key: CORS_ALLOW_ORIGIN_REGEX
        value: "^https://pneumonia-detection-cnn-[a-z0-9-]+\\.vercel\\.app$"
